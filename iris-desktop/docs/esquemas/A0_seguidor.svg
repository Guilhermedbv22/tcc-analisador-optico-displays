<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><rect width="1440" height="1000" fill="#fff"/><text x="40" y="48" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="28" fill="#176d9d" font-weight="bold" text-anchor="start">CIRCUITO A0 · teste dos seguidores</text><text x="40" y="82" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="16" fill="#19344d" font-weight="normal" text-anchor="start">Sem fotodiodos, Rf ou Cf. Validar as soldas e ambos os canais antes de montar o TIA.</text><line x1="40" y1="105" x2="1400" y2="105" stroke="#c4d4e2" stroke-width="2"/><polyline points="610,305 610,435 740,370 610,305" fill="none" stroke="#19344d" stroke-width="3"/><text x="624" y="348" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="24" fill="#19344d" font-weight="normal" text-anchor="start">−</text><text x="624" y="411" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="24" fill="#19344d" font-weight="normal" text-anchor="start">+</text><text x="602" y="329" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="15" fill="#19344d" font-weight="normal" text-anchor="end">2</text><text x="602" y="404" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="15" fill="#19344d" font-weight="normal" text-anchor="end">3</text><text x="746" y="362" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="15" fill="#19344d" font-weight="normal" text-anchor="start">1</text><text x="740" y="462" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="17" fill="#176d9d" font-weight="bold" text-anchor="middle">U1A · MCP6022</text><line x1="430" y1="400" x2="610" y2="400" stroke="#258073" stroke-width="3"/><text x="420" y="405" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="17" fill="#176d9d" font-weight="bold" text-anchor="end">TESTE</text><line x1="740" y1="370" x2="840" y2="370" stroke="#258073" stroke-width="3"/><polyline points="790,370 790,245 550,245 550,340 610,340" fill="none" stroke="#258073" stroke-width="3"/><circle cx="790" cy="370" r="5" fill="#258073"/><line x1="870" y1="370" x2="892" y2="370" stroke="#19344d" stroke-width="3"/><rect x="892" y="361" width="76" height="18" rx="4" fill="white" stroke="#19344d" stroke-width="2"/><line x1="968" y1="370" x2="990" y2="370" stroke="#19344d" stroke-width="3"/><text x="930" y="347" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="15" fill="#19344d" font-weight="normal" text-anchor="middle">Riso · 100 Ω</text><line x1="840" y1="370" x2="870" y2="370" stroke="#258073" stroke-width="3"/><line x1="990" y1="370" x2="1120" y2="370" stroke="#258073" stroke-width="3"/><text x="1140" y="375" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="17" fill="#176d9d" font-weight="bold" text-anchor="start">CH1 · saída A</text><polyline points="610,585 610,715 740,650 610,585" fill="none" stroke="#19344d" stroke-width="3"/><text x="624" y="628" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="24" fill="#19344d" font-weight="normal" text-anchor="start">−</text><text x="624" y="691" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="24" fill="#19344d" font-weight="normal" text-anchor="start">+</text><text x="602" y="609" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="15" fill="#19344d" font-weight="normal" text-anchor="end">6</text><text x="602" y="684" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="15" fill="#19344d" font-weight="normal" text-anchor="end">5</text><text x="746" y="642" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="15" fill="#19344d" font-weight="normal" text-anchor="start">7</text><text x="740" y="742" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="17" fill="#176d9d" font-weight="bold" text-anchor="middle">U1B · MCP6022</text><line x1="430" y1="680" x2="610" y2="680" stroke="#258073" stroke-width="3"/><text x="420" y="685" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="17" fill="#176d9d" font-weight="bold" text-anchor="end">TESTE</text><line x1="740" y1="650" x2="840" y2="650" stroke="#258073" stroke-width="3"/><polyline points="790,650 790,525 550,525 550,620 610,620" fill="none" stroke="#258073" stroke-width="3"/><circle cx="790" cy="650" r="5" fill="#258073"/><line x1="870" y1="650" x2="892" y2="650" stroke="#19344d" stroke-width="3"/><rect x="892" y="641" width="76" height="18" rx="4" fill="white" stroke="#19344d" stroke-width="2"/><line x1="968" y1="650" x2="990" y2="650" stroke="#19344d" stroke-width="3"/><text x="930" y="627" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="15" fill="#19344d" font-weight="normal" text-anchor="middle">Riso · 100 Ω</text><line x1="840" y1="650" x2="870" y2="650" stroke="#258073" stroke-width="3"/><line x1="990" y1="650" x2="1120" y2="650" stroke="#258073" stroke-width="3"/><text x="1140" y="655" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="17" fill="#176d9d" font-weight="bold" text-anchor="start">CH2 · saída B</text><text x="40" y="160" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="21" fill="#176d9d" font-weight="bold" text-anchor="start">Fonte TESTE</text><text x="40" y="200" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="18" fill="#19344d" font-weight="normal" text-anchor="start">3V3 → 10k → P75 → 10k → P50 → 10k → P25 → 10k → GND</text><text x="40" y="237" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="17" fill="#19344d" font-weight="normal" text-anchor="start">Escolha um ponto para TESTE; CH0 ← TESTE por 100 Ω. Canais são sequenciais.</text><text x="40" y="790" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="17" fill="#19344d" font-weight="normal" text-anchor="start">U1.8=3V3; U1.4=GND; 100 nF entre 8–4 junto do adaptador; 2,2–4,7 µF no rail.</text><text x="40" y="828" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="17" fill="#19344d" font-weight="normal" text-anchor="start">25/50/75% do rail: saídas devem acompanhar a entrada; não exigir saída idêntica a VDD.</text><text x="40" y="866" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="17" fill="#19344d" font-weight="normal" text-anchor="start">Antes do teste CH0–GND: desligue a ponta de qualquer saída ativa, evitando curto no operacional.</text><text x="40" y="904" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="17" fill="#19344d" font-weight="normal" text-anchor="start">Para converter em TIA, retirar pontes diretas de A e ligação TESTE→3/5; seguir esquema A1.</text></svg>