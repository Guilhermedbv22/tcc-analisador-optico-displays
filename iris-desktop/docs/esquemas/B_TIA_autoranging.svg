<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1100" viewBox="0 0 1500 1100"><rect width="1500" height="1100" fill="#fff"/><text x="40" y="48" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="28" fill="#176d9d" font-weight="bold" text-anchor="start">CIRCUITO B · realimentação com CD4066BE</text><text x="40" y="82" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="16" fill="#19344d" font-weight="normal" text-anchor="start">Manter o TIA, fotodiodos e ADC do A1; substituir somente a rede Rf/Cf. Valores iniciais a validar.</text><line x1="40" y1="105" x2="1460" y2="105" stroke="#c4d4e2" stroke-width="2"/><line x1="180" y1="180" x2="180" y2="800" stroke="#9347a4" stroke-width="3"/><line x1="1300" y1="180" x2="1300" y2="800" stroke="#9347a4" stroke-width="3"/><text x="180" y="150" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="19" fill="#9347a4" font-weight="bold" text-anchor="middle">SUM = U1.2</text><text x="1300" y="150" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="19" fill="#176d9d" font-weight="bold" text-anchor="middle">OUT = U1.1</text><line x1="180" y1="220" x2="600" y2="220" stroke="#9347a4" stroke-width="3"/><line x1="600" y1="220" x2="622" y2="220" stroke="#9347a4" stroke-width="3"/><rect x="622" y="211" width="76" height="18" rx="4" fill="white" stroke="#9347a4" stroke-width="2"/><line x1="698" y1="220" x2="720" y2="220" stroke="#9347a4" stroke-width="3"/><text x="660" y="197" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="15" fill="#9347a4" font-weight="normal" text-anchor="middle">Rbase · 470 kΩ</text><line x1="720" y1="220" x2="1300" y2="220" stroke="#9347a4" stroke-width="3"/><circle cx="180" cy="220" r="5" fill="#9347a4"/><circle cx="1300" cy="220" r="5" fill="#9347a4"/><line x1="180" y1="300" x2="600" y2="300" stroke="#9347a4" stroke-width="3"/><line x1="600" y1="300" x2="652" y2="300" stroke="#9347a4" stroke-width="3"/><line x1="652" y1="285" x2="652" y2="315" stroke="#9347a4" stroke-width="3"/><line x1="668" y1="285" x2="668" y2="315" stroke="#9347a4" stroke-width="3"/><line x1="668" y1="300" x2="720" y2="300" stroke="#9347a4" stroke-width="3"/><text x="660" y="276" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="15" fill="#9347a4" font-weight="normal" text-anchor="middle">Cbase · 4,7 pF</text><line x1="720" y1="300" x2="1300" y2="300" stroke="#9347a4" stroke-width="3"/><circle cx="180" cy="300" r="5" fill="#9347a4"/><circle cx="1300" cy="300" r="5" fill="#9347a4"/><line x1="180" y1="430" x2="460" y2="430" stroke="#9347a4" stroke-width="3"/><line x1="460" y1="430" x2="482" y2="430" stroke="#9347a4" stroke-width="3"/><rect x="482" y="421" width="76" height="18" rx="4" fill="white" stroke="#9347a4" stroke-width="2"/><line x1="558" y1="430" x2="580" y2="430" stroke="#9347a4" stroke-width="3"/><text x="520" y="407" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="15" fill="#9347a4" font-weight="normal" text-anchor="middle">R0 · 52,3 kΩ</text><line x1="580" y1="430" x2="850" y2="430" stroke="#9347a4" stroke-width="3"/><polyline points="400,430 400,485 460,485" fill="none" stroke="#9347a4" stroke-width="3"/><line x1="460" y1="485" x2="512" y2="485" stroke="#9347a4" stroke-width="3"/><line x1="512" y1="470" x2="512" y2="500" stroke="#9347a4" stroke-width="3"/><line x1="528" y1="470" x2="528" y2="500" stroke="#9347a4" stroke-width="3"/><line x1="528" y1="485" x2="580" y2="485" stroke="#9347a4" stroke-width="3"/><text x="520" y="461" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="15" fill="#9347a4" font-weight="normal" text-anchor="middle">C0 · 3,3 pF</text><polyline points="580,485 700,485 700,430" fill="none" stroke="#9347a4" stroke-width="3"/><circle cx="400" cy="430" r="5" fill="#9347a4"/><circle cx="700" cy="430" r="5" fill="#9347a4"/><line x1="850" y1="430" x2="910" y2="430" stroke="#9347a4" stroke-width="3"/><circle cx="910" cy="430" r="5" fill="#9347a4"/><line x1="918" y1="425" x2="1000" y2="402" stroke="#9347a4" stroke-width="3"/><circle cx="1015" cy="430" r="5" fill="#9347a4"/><line x1="1015" y1="430" x2="1300" y2="430" stroke="#9347a4" stroke-width="3"/><text x="902" y="412" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="14" fill="#19344d" font-weight="normal" text-anchor="end">2</text><text x="1030" y="413" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="14" fill="#19344d" font-weight="normal" text-anchor="start">1</text><text x="975" y="473" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="17" fill="#176d9d" font-weight="bold" text-anchor="middle">CD chave 1</text><text x="970" y="360" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="15" fill="#176d9d" font-weight="normal" text-anchor="middle">GPIO32 → 330 Ω → controle 13</text><text x="970" y="383" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="15" fill="#19344d" font-weight="normal" text-anchor="middle">controle 13 → 100 kΩ → GND</text><circle cx="180" cy="430" r="5" fill="#9347a4"/><circle cx="1300" cy="430" r="5" fill="#9347a4"/><line x1="180" y1="580" x2="460" y2="580" stroke="#9347a4" stroke-width="3"/><line x1="460" y1="580" x2="482" y2="580" stroke="#9347a4" stroke-width="3"/><rect x="482" y="571" width="76" height="18" rx="4" fill="white" stroke="#9347a4" stroke-width="2"/><line x1="558" y1="580" x2="580" y2="580" stroke="#9347a4" stroke-width="3"/><text x="520" y="557" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="15" fill="#9347a4" font-weight="normal" text-anchor="middle">R1 · 127 kΩ</text><line x1="580" y1="580" x2="850" y2="580" stroke="#9347a4" stroke-width="3"/><polyline points="400,580 400,635 460,635" fill="none" stroke="#9347a4" stroke-width="3"/><line x1="460" y1="635" x2="512" y2="635" stroke="#9347a4" stroke-width="3"/><line x1="512" y1="620" x2="512" y2="650" stroke="#9347a4" stroke-width="3"/><line x1="528" y1="620" x2="528" y2="650" stroke="#9347a4" stroke-width="3"/><line x1="528" y1="635" x2="580" y2="635" stroke="#9347a4" stroke-width="3"/><text x="520" y="611" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="15" fill="#9347a4" font-weight="normal" text-anchor="middle">C1 · 1,0 pF</text><polyline points="580,635 700,635 700,580" fill="none" stroke="#9347a4" stroke-width="3"/><circle cx="400" cy="580" r="5" fill="#9347a4"/><circle cx="700" cy="580" r="5" fill="#9347a4"/><line x1="850" y1="580" x2="910" y2="580" stroke="#9347a4" stroke-width="3"/><circle cx="910" cy="580" r="5" fill="#9347a4"/><line x1="918" y1="575" x2="1000" y2="552" stroke="#9347a4" stroke-width="3"/><circle cx="1015" cy="580" r="5" fill="#9347a4"/><line x1="1015" y1="580" x2="1300" y2="580" stroke="#9347a4" stroke-width="3"/><text x="902" y="562" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="14" fill="#19344d" font-weight="normal" text-anchor="end">3</text><text x="1030" y="563" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="14" fill="#19344d" font-weight="normal" text-anchor="start">4</text><text x="975" y="623" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="17" fill="#176d9d" font-weight="bold" text-anchor="middle">CD chave 2</text><text x="970" y="510" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="15" fill="#176d9d" font-weight="normal" text-anchor="middle">GPIO33 → 330 Ω → controle 5</text><text x="970" y="533" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="15" fill="#19344d" font-weight="normal" text-anchor="middle">controle 5 → 100 kΩ → GND</text><circle cx="180" cy="580" r="5" fill="#9347a4"/><circle cx="1300" cy="580" r="5" fill="#9347a4"/><line x1="180" y1="730" x2="460" y2="730" stroke="#9347a4" stroke-width="3"/><line x1="460" y1="730" x2="482" y2="730" stroke="#9347a4" stroke-width="3"/><rect x="482" y="721" width="76" height="18" rx="4" fill="white" stroke="#9347a4" stroke-width="2"/><line x1="558" y1="730" x2="580" y2="730" stroke="#9347a4" stroke-width="3"/><text x="520" y="707" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="15" fill="#9347a4" font-weight="normal" text-anchor="middle">R2 · 412 kΩ</text><line x1="580" y1="730" x2="850" y2="730" stroke="#9347a4" stroke-width="3"/><polyline points="400,730 400,785 460,785" fill="none" stroke="#9347a4" stroke-width="3"/><line x1="460" y1="785" x2="512" y2="785" stroke="#9347a4" stroke-width="3"/><line x1="512" y1="770" x2="512" y2="800" stroke="#9347a4" stroke-width="3"/><line x1="528" y1="770" x2="528" y2="800" stroke="#9347a4" stroke-width="3"/><line x1="528" y1="785" x2="580" y2="785" stroke="#9347a4" stroke-width="3"/><text x="520" y="761" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="15" fill="#9347a4" font-weight="normal" text-anchor="middle">C2 · 1,0 pF</text><polyline points="580,785 700,785 700,730" fill="none" stroke="#9347a4" stroke-width="3"/><circle cx="400" cy="730" r="5" fill="#9347a4"/><circle cx="700" cy="730" r="5" fill="#9347a4"/><line x1="850" y1="730" x2="910" y2="730" stroke="#9347a4" stroke-width="3"/><circle cx="910" cy="730" r="5" fill="#9347a4"/><line x1="918" y1="725" x2="1000" y2="702" stroke="#9347a4" stroke-width="3"/><circle cx="1015" cy="730" r="5" fill="#9347a4"/><line x1="1015" y1="730" x2="1300" y2="730" stroke="#9347a4" stroke-width="3"/><text x="902" y="712" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="14" fill="#19344d" font-weight="normal" text-anchor="end">9</text><text x="1030" y="713" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="14" fill="#19344d" font-weight="normal" text-anchor="start">8</text><text x="975" y="773" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="17" fill="#176d9d" font-weight="bold" text-anchor="middle">CD chave 3</text><text x="970" y="660" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="15" fill="#176d9d" font-weight="normal" text-anchor="middle">GPIO26 → 330 Ω → controle 6</text><text x="970" y="683" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="15" fill="#19344d" font-weight="normal" text-anchor="middle">controle 6 → 100 kΩ → GND</text><circle cx="180" cy="730" r="5" fill="#9347a4"/><circle cx="1300" cy="730" r="5" fill="#9347a4"/><text x="40" y="880" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="18" fill="#176d9d" font-weight="bold" text-anchor="start">CD4066BE: pino 14 = 3V3; pino 7 = GND; 100 nF entre 14–7; 2,2 µF no rail.</text><text x="40" y="920" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="17" fill="#19344d" font-weight="normal" text-anchor="start">Sem uso: pinos 10, 11 e 12 no GND. Não há SN74HCT125N nesta versão.</text><text x="40" y="951" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="17" fill="#19344d" font-weight="normal" text-anchor="start">G0: somente controle 13 HIGH; G1: somente 5 HIGH; G2: somente 6 HIGH; G3: todos LOW.</text><text x="40" y="982" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="17" fill="#19344d" font-weight="normal" text-anchor="start">Ganho ideal: 47,063 / 99,983 / 219,546 / 470 kΩ. RON e parasitas alteram ganho e banda.</text><text x="40" y="1013" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="17" fill="#19344d" font-weight="normal" text-anchor="start">Chaves no lado OUT; ramo permanente nunca abre. Reset deixa G3; habilitar seleciona G0.</text><text x="40" y="1044" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="17" fill="#19344d" font-weight="normal" text-anchor="start">Cf são pontos iniciais, não valores de estabilidade garantida; qualificar todas as faixas antes de automático.</text></svg>