679" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="16" fill="#19344d" font-weight="normal" text-anchor="start">3V3 → 100k → MID → 100k → GND</text><text x="900" y="711" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="16" fill="#19344d" font-weight="normal" text-anchor="start">MID → 100 nF → GND; U1.5 → MID</text><text x="900" y="743" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="16" fill="#19344d" font-weight="normal" text-anchor="start">U1.6 ↔ U1.7; saída B sem carga</text><text x="40" y="862" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="17" fill="#19344d" font-weight="normal" text-anchor="start">U1.8=3V3; U1.4=GND; 100 nF entre 8–4 e 2,2–4,7 µF perto do adaptador.</text><text x="40" y="897" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="17" fill="#19344d" font-weight="normal" text-anchor="start">Rf/Cf antes dos 100 Ω; cabos mínimos em SUM. Compensação e banda precisam de qualificação.</text><text x="40" y="932" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="17" fill="#19344d" font-weight="normal" text-anchor="start">MCP3208 e ESP32: ver ADC_ESP32.svg. Não tocar SUM com ADC ou ponta comum durante medição.</text></svg>