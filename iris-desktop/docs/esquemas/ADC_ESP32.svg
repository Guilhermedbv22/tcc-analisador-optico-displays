<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><rect width="1440" height="1000" fill="#fff"/><text x="40" y="48" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="28" fill="#176d9d" font-weight="bold" text-anchor="start">ÍRIS · ligação comum do ADC e ESP32</text><text x="40" y="82" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="16" fill="#19344d" font-weight="normal" text-anchor="start">MCP3208 DIP16, SPI modo 0, VDD=VREF=3V3. Pontos com a mesma rede estão ligados.</text><line x1="40" y1="105" x2="1400" y2="105" stroke="#c4d4e2" stroke-width="2"/><rect x="480" y="170" width="330" height="440" rx="4" fill="white" stroke="#19344d" stroke-width="2"/><text x="645" y="200" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="23" fill="#176d9d" font-weight="bold" text-anchor="middle">U2 · MCP3208</text><line x1="410" y1="245" x2="480" y2="245" stroke="#258073" stroke-width="3"/><text x="495" y="250" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="16" fill="#19344d" font-weight="normal" text-anchor="start">1 · CH0</text><text x="395" y="250" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="14" fill="#19344d" font-weight="normal" text-anchor="end">SINAL</text><line x1="410" y1="290" x2="480" y2="290" stroke="#258073" stroke-width="3"/><text x="495" y="295" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="16" fill="#19344d" font-weight="normal" text-anchor="start">2 · CH1</text><text x="395" y="295" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="14" fill="#19344d" font-weight="normal" text-anchor="end">TESTE / GND se sem uso</text><line x1="410" y1="335" x2="480" y2="335" stroke="#258073" stroke-width="3"/><text x="495" y="340" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="16" fill="#19344d" font-weight="normal" text-anchor="start">3 · CH2</text><text x="395" y="340" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="14" fill="#19344d" font-weight="normal" text-anchor="end">TESTE / GND se sem uso</text><line x1="410" y1="380" x2="480" y2="380" stroke="#258073" stroke-width="3"/><text x="495" y="385" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="16" fill="#19344d" font-weight="normal" text-anchor="start">4 · CH3</text><text x="395" y="385" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="14" fill="#19344d" font-weight="normal" text-anchor="end">TESTE / GND se sem uso</text><line x1="410" y1="425" x2="480" y2="425" stroke="#258073" stroke-width="3"/><text x="495" y="430" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="16" fill="#19344d" font-weight="normal" text-anchor="start">5 · CH4</text><text x="395" y="430" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="14" fill="#19344d" font-weight="normal" text-anchor="end">TESTE / GND se sem uso</text><line x1="410" y1="470" x2="480" y2="470" stroke="#258073" stroke-width="3"/><text x="495" y="475" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="16" fill="#19344d" font-weight="normal" text-anchor="start">6 · CH5</text><text x="395" y="475" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="14" fill="#19344d" font-weight="normal" text-anchor="end">TESTE / GND se sem uso</text><line x1="410" y1="515" x2="480" y2="515" stroke="#258073" stroke-width="3"/><text x="495" y="520" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="16" fill="#19344d" font-weight="normal" text-anchor="start">7 · CH6</text><text x="395" y="520" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="14" fill="#19344d" font-weight="normal" text-anchor="end">TESTE / GND se sem uso</text><line x1="410" y1="560" x2="480" y2="560" stroke="#258073" stroke-width="3"/><text x="495" y="565" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="16" fill="#19344d" font-weight="normal" text-anchor="start">8 · CH7</text><text x="395" y="565" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="14" fill="#19344d" font-weight="normal" text-anchor="end">TESTE / GND se sem uso</text><text x="795" y="250" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="16" fill="#19344d" font-weight="normal" text-anchor="end">16 · VDD</text><line x1="810" y1="245" x2="960" y2="245" stroke="#258073" stroke-width="3"/><text x="975" y="250" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="17" fill="#176d9d" font-weight="bold" text-anchor="start">3V3</text><text x="795" y="295" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="16" fill="#19344d" font-weight="normal" text-anchor="end">15 · VREF</text><line x1="810" y1="290" x2="960" y2="290" stroke="#258073" stroke-width="3"/><text x="975" y="295" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="17" fill="#176d9d" font-weight="bold" text-anchor="start">3V3</text><text x="795" y="340" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="16" fill="#19344d" font-weight="normal" text-anchor="end">14 · AGND</text><line x1="810" y1="335" x2="960" y2="335" stroke="#258073" stroke-width="3"/><text x="975" y="340" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="17" fill="#176d9d" font-weight="bold" text-anchor="start">GND</text><text x="795" y="385" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="16" fill="#19344d" font-weight="normal" text-anchor="end">13 · CLK</text><line x1="810" y1="380" x2="960" y2="380" stroke="#258073" stroke-width="3"/><text x="975" y="385" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="17" fill="#176d9d" font-weight="bold" text-anchor="start">GPIO18</text><text x="795" y="430" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="16" fill="#19344d" font-weight="normal" text-anchor="end">12 · DOUT</text><line x1="810" y1="425" x2="960" y2="425" stroke="#258073" stroke-width="3"/><text x="975" y="430" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="17" fill="#176d9d" font-weight="bold" text-anchor="start">GPIO19</text><text x="795" y="475" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="16" fill="#19344d" font-weight="normal" text-anchor="end">11 · DIN</text><line x1="810" y1="470" x2="960" y2="470" stroke="#258073" stroke-width="3"/><text x="975" y="475" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="17" fill="#176d9d" font-weight="bold" text-anchor="start">GPIO23</text><text x="795" y="520" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="16" fill="#19344d" font-weight="normal" text-anchor="end">10 · CS</text><line x1="810" y1="515" x2="960" y2="515" stroke="#258073" stroke-width="3"/><text x="975" y="520" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="17" fill="#176d9d" font-weight="bold" text-anchor="start">GPIO27</text><text x="795" y="565" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="16" fill="#19344d" font-weight="normal" text-anchor="end">9 · DGND</text><line x1="810" y1="560" x2="960" y2="560" stroke="#258073" stroke-width="3"/><text x="975" y="565" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="17" fill="#176d9d" font-weight="bold" text-anchor="start">GND</text><text x="40" y="700" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="21" fill="#176d9d" font-weight="bold" text-anchor="start">Desacoplamento e referência</text><text x="40" y="738" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="17" fill="#19344d" font-weight="normal" text-anchor="start">C_ADC 100 nF: U2.16 ↔ U2.14; C_REF 100 nF: U2.15 ↔ U2.14.</text><text x="40" y="773" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="17" fill="#19344d" font-weight="normal" text-anchor="start">4,7 µF: 3V3 ↔ GND perto do ADC. CS: 10 kΩ para 3V3.</text><text x="40" y="808" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="17" fill="#19344d" font-weight="normal" text-anchor="start">ESP32: 3V3 → rail 3V3; GND → GND. Alimentação USB. SPI 18/19/23/27.</text><text x="40" y="843" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="17" fill="#19344d" font-weight="normal" text-anchor="start">Opcionais 47 Ω em série no SPI, junto ao transmissor. ADC interno: SINAL → GPIO34.</text><text x="40" y="878" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="17" fill="#19344d" font-weight="normal" text-anchor="start">VREF configurada no software é informada, não medida; não calibra a tensão do próprio rail.</text><text x="40" y="913" font-family="DejaVu Sans,Segoe UI,sans-serif" font-size="17" fill="#19344d" font-weight="normal" text-anchor="start">SINAL vem da saída do operacional por 100 Ω. Nunca 5 V diretos, nem tensão negativa.</text></svg>